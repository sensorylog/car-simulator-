name: Build Windows prototype

on:
  push:
    branches:
      - build/first-playable
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 3.6.3 and export templates
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/3.6.3-stable"
          Invoke-WebRequest "$base/Godot_v3.6.3-stable_win64.exe.zip" -OutFile "$env:RUNNER_TEMP/godot.zip"
          Expand-Archive "$env:RUNNER_TEMP/godot.zip" "$env:RUNNER_TEMP/godot" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP/godot" -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Godot executable missing." }
          "GODOT_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append

          Invoke-WebRequest "$base/Godot_v3.6.3-stable_export_templates.tpz" -OutFile "$env:RUNNER_TEMP/templates.tpz"
          Expand-Archive "$env:RUNNER_TEMP/templates.tpz" "$env:RUNNER_TEMP/templates" -Force
          $sourceTemplates = Join-Path $env:RUNNER_TEMP "templates\templates"
          if (-not (Test-Path $sourceTemplates)) {
            $found = Get-ChildItem "$env:RUNNER_TEMP/templates" -Directory -Recurse | Select-Object -ExpandProperty FullName
            Write-Host "Extracted template directories:"
            $found | ForEach-Object { Write-Host $_ }
            throw "Could not find the Godot export templates directory."
          }
          $templateVersion = Join-Path (Join-Path $env:APPDATA "Godot\templates") "3.6.3.stable"
          New-Item -ItemType Directory -Force -Path $templateVersion | Out-Null
          Copy-Item (Join-Path $sourceTemplates "*") $templateVersion -Recurse -Force

      - name: Import and validate project
        shell: pwsh
        run: |
          & $env:GODOT_EXE --path "$env:GITHUB_WORKSPACE" --editor --no-window --quit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Export Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          & $env:GODOT_EXE --path "$env:GITHUB_WORKSPACE" --export-release "Windows Desktop" "build/ProjectVelocity.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "build/ProjectVelocity.exe")) { throw "Windows executable was not created." }

      - name: Package portable prototype
        shell: pwsh
        run: |
          Copy-Item "README.md" "build/README.txt"
          Compress-Archive -Path "build/ProjectVelocity.exe","build/README.txt" -DestinationPath "ProjectVelocity-Windows.zip" -Force

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectVelocity-Windows-Prototype
          path: ProjectVelocity-Windows.zip
          if-no-files-found: error
