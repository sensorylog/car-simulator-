name: Build Windows prototype

on:
  push:
    branches:
      - build/first-playable
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install virtual display and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip zip

      - name: Download Godot 3.6.3 and install Windows export templates
        shell: bash
        run: |
          set -euxo pipefail
          base="https://github.com/godotengine/godot/releases/download/3.6.3-stable"
          curl -L "$base/Godot_v3.6.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 2 -type f -name 'Godot*' | head -n 1)"
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          curl -L "$base/Godot_v3.6.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          test -f "$RUNNER_TEMP/templates/templates/windows_64_release.exe"
          mkdir -p "$HOME/.local/share/godot/templates/3.6.3.stable"
          cp -a "$RUNNER_TEMP/templates/templates/." "$HOME/.local/share/godot/templates/3.6.3.stable/"
          test -f "$HOME/.local/share/godot/templates/3.6.3.stable/windows_64_release.exe"

      - name: Import and validate project using virtual display
        shell: bash
        run: |
          set -euxo pipefail
          xvfb-run -a "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --editor --quit --verbose

      - name: Export Windows executable
        shell: bash
        run: |
          set -euxo pipefail
          output="$GITHUB_WORKSPACE/ProjectVelocity.exe"
          xvfb-run -a "$GODOT_BIN" --path "$GITHUB_WORKSPACE" --export-release "Windows Desktop" "$output" --verbose
          test -s "$output"
          size=$(stat -c%s "$output")
          echo "Windows executable size: $size bytes"
          test "$size" -gt 1000000
          signature=$(od -An -tx1 -N2 "$output" | tr -d ' \n')
          test "$signature" = "4d5a"

      - name: Package portable prototype
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p package
          cp ProjectVelocity.exe package/
          cp README.md package/README.txt
          (cd package && zip -q -9 "$GITHUB_WORKSPACE/ProjectVelocity-Windows.zip" ProjectVelocity.exe README.txt)
          test -s ProjectVelocity-Windows.zip
          ls -lh ProjectVelocity.exe ProjectVelocity-Windows.zip

      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectVelocity-Windows-Prototype
          path: ProjectVelocity-Windows.zip
          if-no-files-found: error
